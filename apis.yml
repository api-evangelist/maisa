aid: maisa
name: Maisa
description: >-
  Maisa is an enterprise agentic-AI company whose platform, Maisa Studio, lets
  non-technical teams build, deploy, and manage "Digital Workers" — AI agents
  that automate complex, regulated, end-to-end business processes. Its
  proprietary Knowledge Processing Unit (KPU) and Chain-of-Work approach combine
  large and small language models to deliver deterministic, auditable,
  hallucination-resistant execution rather than probabilistic responses, making
  it regulator-ready from day one. Maisa targets highly regulated verticals —
  banking and financial services, insurance, manufacturing and supply chain, and
  engineering/infrastructure — with an employee-based pricing model instead of
  per-token API billing. Maisa also exposes a developer REST API at
  api.maisa.ai (API-key authenticated via X-API-Key) with capabilities
  (compare/extract/summarize over text and media), models (embeddings, rerank),
  a KPU run endpoint, a file-interpreter (PDF/DOCX/HTML/image/audio), and Mainet
  search — with official first-party Python and Node SDKs both named "maisa";
  the Maisa Studio product and the docs portal (docs.maisa.ai) sit behind an AWS
  Cognito login. Backed by Creandum and ForgePoint, Maisa has raised a $25M
  seed round and been named a Gartner front-runner in agentic AI. This profile
  was enriched from Maisa's public marketing surface, llms.txt, and the official
  open-source SDK repositories.
